name: Aggregator Daily Build

on:
  schedule:
    # 每 10 天 UTC 0:00 运行（北京时间 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_crawl:
        description: '强制重新爬取（无视已有 raw-nodes）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # ---------- 第一阶段：搜索与聚合 ----------
  fetch_raw:
    runs-on: ubuntu-latest
    outputs:
      skip_crawl: ${{ steps.check_artifact.outputs.skip_crawl }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Check existing raw-nodes artifact
        id: check_artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force_crawl }}" = "true" ]; then
            echo "Force crawl enabled, skip artifact restore."
            echo "skip_crawl=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Looking for previous raw-nodes artifact..."
          WORKFLOW_FILE=$(basename "${{ github.workflow_ref }}" | cut -d'@' -f1)
          PREV_RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" --json databaseId \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})] | .[0].databaseId // empty' || true)

          if [ -n "$PREV_RUN_ID" ]; then
            echo "Previous run ID: $PREV_RUN_ID"
            if gh run download "$PREV_RUN_ID" -n raw-nodes --dir . 2>/dev/null; then
              echo "Restored raw-nodes, will skip crawl."
              echo "skip_crawl=true" >> $GITHUB_OUTPUT
            else
              echo "Artifact expired or missing, need crawl."
              echo "skip_crawl=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous run found, need crawl."
            echo "skip_crawl=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check_artifact.outputs.skip_crawl != 'true'
        uses: actions/setup-python@main
        with:
          python-version: 'x'

      - name: Install dependencies
        if: steps.check_artifact.outputs.skip_crawl != 'true'
        run: pip install requests PyYAML

      - name: Run aggregator
        if: steps.check_artifact.outputs.skip_crawl != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python aggregator.py

      - name: Upload raw-nodes artifact
        uses: actions/upload-artifact@main
        with:
          name: raw-nodes
          path: nodes.txt
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # ---------- 第二阶段：合并、过滤、测速、发布 ----------
  check_active:
    needs: fetch_raw
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: 'x'

      - name: Download raw-nodes
        uses: actions/download-artifact@main
        with:
          name: raw-nodes

      - name: Merge with previous release nodes
        run: |
          echo "Fetching previous nodes from release branch..."
          if wget -qO previous_nodes.txt \
            "https://raw.githubusercontent.com/${{ github.repository }}/release/nodes.txt"; then
            echo "Previous nodes downloaded."
            python merge_nodes.py
            echo "Merge & dedup finished."
          else
            echo "No previous nodes (first run or missing), skip merge."
          fi

      - name: Filter by keywords
        run: |
          if [ -f filter_nodes.py ]; then
            python filter_nodes.py
            if [ -f nodes_filtered.txt ]; then
              mv nodes_filtered.txt nodes.txt
              echo "Keyword filter done."
            fi
          else
            echo "filter_nodes.py not found, skip."
          fi

      - name: Install maxminddb & update GeoIP
        run: |
          pip install maxminddb
          echo "Downloading latest GeoLite2-Country..."
          if wget -T 15 -qO temp_geo.mmdb \
            "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb"; then
            mv temp_geo.mmdb GeoLite2-Country.mmdb
            cp GeoLite2-Country.mmdb geoip.mmdb
            if [ -n "$(git status --porcelain GeoLite2-Country.mmdb)" ]; then
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"
              git add GeoLite2-Country.mmdb
              git commit -m "Auto-update GeoLite2-Country.mmdb [skip ci]"
              git push origin HEAD:${{ github.ref_name }} || true
              echo "GeoIP database updated in repo."
            else
              echo "GeoIP already up-to-date."
            fi
          else
            echo "Download failed, fallback to local."
            rm -f temp_geo.mmdb
            if [ -f GeoLite2-Country.mmdb ]; then
              cp GeoLite2-Country.mmdb geoip.mmdb
              echo "Using local GeoLite2-Country.mmdb"
            else
              echo "WARNING: No GeoIP database available."
            fi
          fi

      - name: Run active check
        run: python check_active.py
      
      - name: Publish to release branch
        run: |
          mkdir -p publish_dir
          cp sub.txt nodes.txt publish_dir/
          cd publish_dir
          git init
          git checkout -b release
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-update valid nodes [$(date -u +%Y-%m-%d)]" || exit 0
          git push --force \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            release
