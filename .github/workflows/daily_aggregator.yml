name: Aggregator Daily Build

on:
  schedule:
    # 每天 UTC 02:00 和 14:00 各运行一次（北京时间 10:00 和 22:00）
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前分支代码
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      # ================== 自动准备依赖清单 ==================
      - name: 检查并自动创建 requirements.txt 清单
        run: |
          if [ ! -f requirements.txt ]; then
            echo "未检测到 requirements.txt，使用 printf 安全生成..."
            printf "requests\nPyYAML\nmaxminddb\n" > requirements.txt
            echo "requirements.txt 创建成功，内容如下："
            cat requirements.txt
          else
            echo "已检测到 requirements.txt，跳过生成。"
          fi

      # ================== 配置 Python 并启用 Pip 缓存 ==================
      - name: 配置 Python 环境 (已启用 Pip 缓存)
        uses: actions/setup-python@main
        with:
          python-version: 'x'
          cache: 'pip'

      - name: 安装必要依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ================== 阶段 1：采集新鲜节点 ==================
      - name: 1. 抓取 GitHub 最新活跃节点
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始抓取最新代码库中的节点..."
          python aggregator.py

      # ================== 阶段 2：粗筛清洗 ==================
      - name: 2. 过滤广告、虚假配置与测试域名
        run: |
          if [ -f filter_nodes.py ]; then
            python filter_nodes.py
          fi

      # ================== 阶段 3：深度测活 ==================
      - name: 3. 准备 GeoIP 离线数据库
        run: |
          echo "下载最新 GeoLite2-Country 数据库..."
          if ! wget -T 15 -qO geoip.mmdb "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb"; then
            echo "最新数据库下载超时，尝试使用仓库备用库..."
            [ -f GeoLite2-Country.mmdb ] && cp GeoLite2-Country.mmdb geoip.mmdb || true
          fi

      - name: 4. 执行深度测活 (TCP/TLS/WS握手嗅探)
        run: |
          python check_active.py

      # ================== 阶段 4：合并历史存活节点 ==================
      - name: 5. 指纹合并（与当前分支上一期 result/nodes.txt 去重）
        run: |
          if [ -f result/nodes.txt ]; then
            echo "发现本地历史 result/nodes.txt，复制进行保活合并..."
            cp result/nodes.txt previous_nodes.txt
            python merge_nodes.py
          else
            echo "未发现历史 result/nodes.txt（首次运行），跳过合并。"
          fi

      # ================== 阶段 5：保存至当前分支 result 目录 ==================
      - name: 6. 提交最终节点至当前分支 result 目录
        run: |
          mkdir -p result
          cp nodes.txt result/nodes.txt
          base64 -w 0 nodes.txt > result/sub.txt

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Runner"

          git add result/nodes.txt result/sub.txt

          if git diff --staged --quiet; then
            echo "节点内容无变化，无需提交。"
          else
            git commit -m "Auto-update verified nodes [$(date -u '+%Y-%m-%d %H:%M:%S UTC')] [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "成功更新并推送到当前分支的 result/ 目录！"
          fi
